[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "roverlib"
version = "0.1.0"
description = "Uma biblioteca Python para manipulação de um Rover com Visão Computacional."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"

authors = [
  { name = "Sarmento", email = "sarmento.neto.francisco@gmail.com" },
  { name = "Gleidson", email = "gleidsonabstract.evgm@gmail.com" },
  { name = "Gutemberg", email = "gutoportelaa@gmail.com"},
  { name = "Hillan", email = "hillan1236@gmail.com"}
]

license = "MIT"
license-files = ["LICENSE"]

classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Development Status :: 3 - Alpha",
  "Topic :: Scientific/Engineering :: Robotics",
]

dependencies = [
  "numpy",
  "opencv-python",
  "click",
  "PyYAML",
  "pyserial",
  "matplotlib",
  "gpiozero",
  "adafruit-blinka",
  "adafruit-circuitpython-pca9685",
  "adafruit-circuitpython-motor"
]

[project.optional-dependencies]
cli = ["click"]
dev = ["pytest", "black", "ruff"]
ai = ["ultralytics", "mediapipe"]

[project.scripts]
rover = "roverlib.cli.main:cli"

[project.urls]
Homepage = "https://github.com/Rover-Project/Rover"
Repository = "https://github.com/Rover-Project/Rover"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

# Arquivos que não são .py, mas precisam ir no pacote instalado
[tool.setuptools.package-data]
roverlib = [
  "cli/templates/**/*",       # template usado pelo `rover new`
  "plugins/pin/bin/*.so",     # módulo nativo do plugin pin (GPIO/PWM)
  "**/*.md",                  # documentação dos plugins/módulos
  "**/*.png",
]

[tool.setuptools.exclude-package-data]
roverlib = ["**/__pycache__/*", "**/*.pyc", "**/.pytest_cache/**"]

[tool.pytest.ini_options]
testpaths = ["src/roverlib"]
# Testes que exigem a Raspberry Pi levam @pytest.mark.hardware e ficam fora da execução padrão.
# Na Raspberry Pi:  python -m pytest -m hardware
addopts = "-m 'not hardware'"
markers = [
  "hardware: exige a Raspberry Pi e o hardware real (rode com: pytest -m hardware)",
]

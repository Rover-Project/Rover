site_name: RoverLib Documentation
site_url: https://rover-project.github.io/Rover/
repo_url: https://github.com/Rover-Project/Rover
repo_name: Rover-Project/Rover

theme:
  name: material
  language: pt-BR
  logo: assets/logo-Rover.png
  palette: 
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs 
    - navigation.sections
    - navigation.expand
    - content.code.copy 
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.highlight: 
      anchor_linenums: true
  - pymdownx.superfences 
  - pymdownx.tabbed: 
      alternate_style: true 
  - admonition
  - def_list

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [roverlib/src]          # lê as docstrings direto do código (sem importar OpenCV/GPIO)
          options:
            docstring_style: google
            docstring_options:
              warn_missing_types: false    # muitas docstrings não anotam tipos de retorno
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            filters: ["!^_"]               # oculta métodos privados

nav:
  - Início: index.md
  - Primeiros passos:
      - Instalação: instalacao.md
      - Primeiro projeto: primeiro-projeto.md
      - Configuração (config.yaml): configuracao.md
  - Guia:
      - Arquitetura: arquitetura.md
      - Exemplos: exemplos.md
  - Referência da API:
      - Rover: api/rover.md
      - Movimento: api/movimento.md
      - Câmera: api/camera.md
      - Pan-tilt da câmera: api/pan_tilt.md
      - Sensores: api/sensores.md
      - Visão e processamento: api/visao.md
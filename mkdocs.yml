site_name: RoverLib Documentation
site_url: https://rover-project.github.io/Rover/
repo_url: https://github.com/Rover-Project/Rover
repo_name: Rover-Project/Rover

theme:
  name: material
  language: pt-BR
  logo: assets/logo-Rover.png
  palette: 
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs 
    - navigation.sections
    - navigation.expand
    - content.code.copy 
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js

markdown_extensions:
  - pymdownx.highlight: 
      anchor_linenums: true
  - pymdownx.superfences 
  - pymdownx.tabbed: 
      alternate_style: true 
  - admonition
  - def_list
  - pymdownx.arithmatex:          # fórmulas em LaTeX ($...$) na trilha Aprender
      generic: true

plugins:
  - search
  - mkdocstrings:
      custom_templates: docs/templates   # tradução dos títulos da API (docs/templates/python/material/languages/pt.html.jinja)
      locale: pt
      handlers:
        python:
          paths: [roverlib/src]          # lê as docstrings direto do código (sem importar OpenCV/GPIO)
          options:
            docstring_style: google
            docstring_options:
              warn_missing_types: false    # muitas docstrings não anotam tipos de retorno
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            filters: ["!^_"]               # oculta métodos privados

nav:
  - Início: index.md
  - Primeiros passos:
      - Instalação: instalacao.md
      - Primeiro projeto: primeiro-projeto.md
      - Configuração (config.yaml): configuracao.md
  - Guia:
      - Arquitetura: arquitetura.md
      - Exemplos: exemplos.md
  - Aprender:
      - Visão geral: aprender/index.md
      - 1. Locomoção diferencial: aprender/aula1-locomocao.md
      - 2. Sensores e estados: aprender/aula2-sensores.md
      - 3. Imagem e cor: aprender/aula3-imagem.md
      - 4. Detecção de objetos: aprender/aula4-deteccao.md
      - 5. Controle por visão: aprender/aula5-controle.md
      - 6. Projeto integrador: aprender/aula6-projeto.md
  - Referência da API:
      - Rover: api/rover.md
      - Movimento: api/movimento.md
      - Câmera: api/camera.md
      - Pan-tilt da câmera: api/pan_tilt.md
      - Sensores: api/sensores.md
      - Visão e processamento: api/visao.md
      - Configuração e erros: api/utilitarios.md